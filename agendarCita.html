<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - FitByAndrea</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet">
    <!-- Local Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="page-wrapper">
        <!-- Navigation -->
        <nav class="navbar">
            <h1 class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">FitBy<span class="text-green">Andrea</span></a></h1>
        </nav>

        <!-- Agendar Cita Section -->
        <div class="contact-header" style="padding-top: 20px;">
            <div class="badge">Asesoría</div>
            <h2 class="section-title">Reserva tu lugar</h2>
        </div>

        <section class="contact" id="agendar-cita">
            <div class="contact-container">
                <form class="contact-form" id="agendar-form">
                    <div class="form-group">
                        <label for="agendar-name">Nombre completo</label>
                        <input type="text" id="agendar-name" name="name" placeholder="Ej. Juan Pérez" required>
                    </div>

                    <div class="form-group">
                        <label for="agendar-phone">Teléfono (WhatsApp)</label>
                        <input type="tel" id="agendar-phone" name="phone" placeholder="+52 123 456 7890" required>
                    </div>

                    <div class="form-group">
                        <label for="agendar-goal">¿Cuál es tu objetivo?</label>
                        <select id="agendar-goal" name="goal" required>
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option value="perder_grasa">Pérdida de grasa</option>
                            <option value="aumentar_masa">Aumento de masa muscular</option>
                            <option value="recomposicion">Recomposición corporal</option>
                            <option value="rendimiento">Mejorar rendimiento físico</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="agendar-level">Nivel de experiencia</label>
                        <select id="agendar-level" name="level" required>
                            <option value="" disabled selected>Selecciona tu nivel</option>
                            <option value="principiante">Principiante</option>
                            <option value="intermedio_avanzado">Intermedio / Avanzado</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="agendar-time">Horarios disponibles</label>
                        <select id="agendar-time" name="time" required>
                            <option value="" disabled selected>Selecciona un horario</option>
                            <option value="manana">Mañana (8:00 AM - 12:00 PM)</option>
                            <option value="tarde">Tarde (1:00 PM - 5:00 PM)</option>
                            <option value="noche">Noche (6:00 PM - 9:00 PM)</option>
                        </select>
                    </div>

                    <button type="submit" class="submit-btn" id="btn-submit-agendar">
                        Agendar mi cita
                        <span class="icon">➔</span>
                    </button>
                    
                    <a href="index.html" style="display:block; text-align:center; color:var(--text-muted); margin-top:20px; text-decoration:none; font-weight:500;">← Volver al inicio</a>
                </form>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer"
            style="text-align: center; padding: 40px 5%; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.1); margin-top: auto;">
            <p>&copy; 2026 FitByAndrea. Todos los derechos reservados.</p>
        </footer>
    </div>

    <a href="https://wa.me/5519000420" target="_blank" class="whatsapp-float" aria-label="Chat on WhatsApp">

    <script src="script.js"></script>
</body>

</html>
